name: Build finaSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run build script
        run: bash scripts/build_kernel.sh

      - name: Upload build diagnostics and results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: finaSU-kiev-diagnostics
          if-no-files-found: warn
          path: |
            output/**
            **/build-errors.txt
            **/build.log
            **/build.log.gz
            **/*audit*.txt
            **/*summary*.txt
